name: Build OpenWrt for Netcore N30 Pro (netcore_n30-pro, PR 24316)

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Source repository"
        default: "https://github.com/bfdeh/openwrt.git"
      branch:
        description: "Branch"
        default: "N30PRO-dev"
      packages:
        description: "Packages to include in the image (space separated)"
        default: "luci luci-i18n-base-ru luci-i18n-firewall-ru luci-i18n-package-manager-ru kmod-mtd-rw kmod-tun kmod-nft-tproxy kmod-nft-socket kmod-inet-diag kmod-netlink-diag sing-box kmod-wireguard wireguard-tools luci-proto-wireguard kmod-usb-storage kmod-usb-storage-uas block-mount usbutils kmod-fs-vfat kmod-fs-exfat kmod-fs-ext4 kmod-fs-ntfs3 kmod-nls-cp437 kmod-nls-iso8859-1 kmod-nls-utf8 e2fsprogs kmod-usb-net-cdc-ether kmod-usb-net-rndis kmod-usb-net-cdc-ncm kmod-usb-net-huawei-cdc-ncm kmod-usb-net-cdc-mbim kmod-usb-net-qmi-wwan kmod-usb-net-ipheth kmod-usb-serial-option kmod-usb-serial-wwan kmod-usb-acm usb-modeswitch uqmi umbim comgt comgt-ncm usbmuxd luci-proto-3g luci-proto-ncm luci-proto-qmi luci-proto-mbim luci-proto-modemmanager modemmanager"
      all_kmods:
        description: "Also build ALL kernel modules and save them as a separate artifact (true/false)"
        default: "true"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools python3-dev rsync swig unzip zlib1g-dev file wget

      - name: Clone source
        run: |
          git clone --depth 1 --branch "${{ inputs.branch }}" "${{ inputs.repo }}" openwrt
          git -C openwrt log -1 --format='Source commit: %H (%cd)'

      - name: Check that the N30 Pro profile exists
        working-directory: openwrt
        run: |
          grep -n -A22 "define Device/netcore_n30-pro" target/linux/mediatek/image/filogic.mk
          grep -n 'label = "lan' target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts

      - name: Add libffi to core if missing (moved from packages feed on 2026-10-19)
        working-directory: openwrt
        run: |
          if [ -d package/libs/libffi ]; then
            echo "libffi already in core"
          else
            git clone -q --depth 1 --filter=blob:none --sparse https://github.com/openwrt/openwrt.git /tmp/owrt-main
            git -C /tmp/owrt-main sparse-checkout set --no-cone /package/libs/libffi/
            cp -r /tmp/owrt-main/package/libs/libffi package/libs/
            ls -la package/libs/libffi
          fi

      - name: Update feeds
        working-directory: openwrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: Add first-boot defaults (GS Router)
        working-directory: openwrt
        run: |
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-gs-defaults <<'EOF'
          #!/bin/sh
          # Runs once on first boot and again after every factory reset.

          uci set system.@system[0].hostname='GS-Router'
          uci set system.@system[0].zonename='Europe/Moscow'
          uci set system.@system[0].timezone='MSK-3'
          uci commit system

          uci set luci.main.lang='ru'
          uci commit luci

          [ -s /etc/config/wireless ] || wifi config

          found=0
          for r in $(uci -q show wireless | sed -n "s/^wireless\.\([^.]*\)=wifi-device$/\1/p"); do
            case "$(uci -q get wireless.$r.band)" in
              2g) ssid='GS Router 2,4g' ;;
              5g) ssid='GS Router 5g' ;;
              *) continue ;;
            esac
            found=1
            uci set wireless.$r.disabled='0'
            uci set wireless.$r.country='RU'
            uci set wireless.$r.channel='auto'
            iface=$(uci -q show wireless | sed -n "s/^wireless\.\([^.]*\)\.device='$r'$/\1/p" | head -n1)
            if [ -z "$iface" ]; then
              iface=$(uci add wireless wifi-iface)
              uci set wireless.$iface.device="$r"
              uci set wireless.$iface.network='lan'
              uci set wireless.$iface.mode='ap'
            fi
            uci set wireless.$iface.ssid="$ssid"
            uci set wireless.$iface.encryption='none'
            uci -q delete wireless.$iface.key
            uci set wireless.$iface.disabled='0'
          done
          uci commit wireless

          # No radios found yet: keep this script and retry on next boot
          [ "$found" = 1 ] || exit 1
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-gs-defaults
          cat files/etc/uci-defaults/99-gs-defaults

      - name: Configure
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n30-pro=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_LUCI_LANG_ru=y
          EOF
          if [ "${{ inputs.all_kmods }}" = "true" ]; then
            echo "CONFIG_ALL_KMODS=y" >> .config
          fi
          for p in ${{ inputs.packages }}; do echo "CONFIG_PACKAGE_$p=y" >> .config; done
          make defconfig
          grep "DEVICE_netcore_n30-pro=y" .config
          grep "TARGET_ROOTFS_INITRAMFS=y" .config
          missing=0
          for p in ${{ inputs.packages }}; do
            grep -q "^CONFIG_PACKAGE_$p=y" .config || { echo "NOT SELECTED: $p"; missing=1; }
          done
          [ $missing -eq 0 ] || exit 1

      - name: Download sources
        working-directory: openwrt
        run: make download -j8

      - name: Build
        working-directory: openwrt
        run: |
          # IGNORE_ERRORS="n m": optional modules (=m, from "all kmods") that fail to build
          # are skipped, like on the official buildbots. Packages in the image (=y) must build.
          make -j$(nproc) IGNORE_ERRORS="n m" || make -j1 V=s IGNORE_ERRORS="n m"

      - name: Check results and make checksums
        working-directory: openwrt/bin/targets/mediatek/filogic
        run: |
          ls -la
          P=openwrt-mediatek-filogic-netcore_n30-pro
          for f in $P-spim-nand-preloader.bin $P-spim-nand-bl31-uboot.fip \
                   $P-initramfs.itb $P-squashfs-sysupgrade.itb; do
            [ -s "$f" ] || { echo "MISSING: $f"; exit 1; }
          done
          M=$(ls *n30-pro*.manifest 2>/dev/null | head -1)
          [ -n "$M" ] || M=$(ls *.manifest | head -1)
          echo "Manifest: $M"
          for p in kmod-tun kmod-nft-tproxy kmod-inet-diag kmod-netlink-diag sing-box; do
            grep -q "^$p " "$M" || { echo "NOT IN IMAGE: $p"; exit 1; }
          done
          grep -E "^(kmod-tun|kmod-nft-tproxy|kmod-nft-socket|kmod-inet-diag|kmod-netlink-diag|sing-box) " "$M"
          md5sum $P-* | tee md5sums-n30pro.txt

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: netcore-n30-pro
          retention-days: 90
          path: |
            openwrt/bin/targets/mediatek/filogic/openwrt-mediatek-filogic-netcore_n30-pro-*
            openwrt/bin/targets/mediatek/filogic/*.manifest
            openwrt/bin/targets/mediatek/filogic/md5sums-n30pro.txt

      - name: Upload kernel modules
        if: inputs.all_kmods == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: netcore-n30-pro-kmods
          retention-days: 90
          path: openwrt/bin/targets/mediatek/filogic/packages/
